server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: aquaruta-vsa
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aquaruta_db}
    username: ${SPRING_DATASOURCE_USERNAME:aquaruta}
    password: ${SPRING_DATASOURCE_PASSWORD:aquaruta_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  sql:
    init:
      mode: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

aquaruta:
  geo:
    bbox:
      min-lat: 17.9650
      min-lon: -92.9650
      max-lat: 18.0150
      max-lon: -92.9050
  consensus:
    radius-meters: 200.0
    quorum-count: 3
    window-hours: 2
  apis:
    overpass-url: "https://overpass-api.de/api/interpreter"
    open-meteo-url: "https://api.open-meteo.com/v1/forecast"
    open-elevation-url: "https://api.open-elevation.com/api/v1/lookup"
  simulation:
    demo-mode-enabled: true

logging:
  level:
    com.aquaruta: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
